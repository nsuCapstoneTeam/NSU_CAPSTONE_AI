services:
  ai:
    image: ${AI_IMAGE:-ghcr.io/nsucapstoneteam/nsu-capstone-ai:phase1}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST for the target database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-capstone_db}
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env to the existing PostgreSQL password}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
      HF_HOME: /var/cache/huggingface
    volumes:
      - type: volume
        source: huggingface_cache
        target: /var/cache/huggingface
        read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  huggingface_cache:

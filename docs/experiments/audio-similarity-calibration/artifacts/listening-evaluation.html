<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>음악-행사 적합도 평가</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #172033; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 18px; }
    main { max-width: 780px; margin: 0 auto; }
    .card { background: white; border: 1px solid #dfe4ed; border-radius: 16px; padding: 28px; box-shadow: 0 8px 28px #16243a0c; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    p { line-height: 1.7; }
    .muted { color: #5b6678; }
    .intro { margin: 0 0 22px; }
    label { display: block; margin: 16px 0 7px; font-weight: 650; }
    select, button { font: inherit; }
    select { width: 100%; padding: 11px 12px; border: 1px solid #bbc5d4; border-radius: 9px; background: #fff; }
    button { border: 0; border-radius: 9px; padding: 11px 16px; cursor: pointer; font-weight: 650; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .primary { background: #2459c4; color: white; }
    .primary:not(:disabled):hover { background: #1949aa; }
    .status { min-height: 25px; color: #526177; margin: 9px 0 2px; }
    .error { color: #a52323; background: #fff1f0; border: 1px solid #ffc8c3; padding: 12px; border-radius: 8px; }
    #evaluation { display: none; }
    .topline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .position { font-weight: 700; color: #34445d; white-space: nowrap; }
    progress { width: 100%; height: 12px; margin: 10px 0 22px; accent-color: #2459c4; }
    .event { background: #f5f7fb; border-radius: 10px; padding: 18px; min-height: 96px; font-size: 1.08rem; }
    audio { display: block; width: 100%; margin: 20px 0 4px; }
    .time { text-align: right; color: #647188; font-variant-numeric: tabular-nums; font-size: .9rem; }
    .question { margin: 25px 0 13px; font-size: 1.08rem; font-weight: 650; }
    .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .rating { min-height: 56px; background: #edf1f7; color: #172033; font-size: 1.15rem; border: 2px solid transparent; }
    .rating.selected { background: #e5edff; border-color: #2459c4; color: #1747a0; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 8px 0 20px; color: #566276; font-size: .82rem; text-align: center; line-height: 1.45; }
    .unable { width: 100%; background: #fff; color: #303c50; border: 1px solid #aab5c5; }
    .unable.selected { background: #fff4d6; border: 2px solid #9a6a00; }
    .nav { display: flex; justify-content: space-between; gap: 14px; border-top: 1px solid #e5e9f0; padding-top: 20px; margin-top: 24px; }
    .secondary { background: #e9edf4; color: #26344b; }
    #complete { display: none; text-align: center; }
    #complete h1 { margin: 0 0 12px; }
    .small { font-size: .9rem; }
    @media (max-width: 560px) {
      body { padding: 16px 10px; }
      .card { padding: 20px 16px; }
      .scale { font-size: .72rem; gap: 4px; }
      .rating-grid { gap: 6px; }
      .topline { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" id="start">
      <h1>음악-행사 적합도 평가</h1>
      <p class="intro">행사 설명을 읽고 음악을 들은 뒤,<br>이 행사에서 이 음악이 얼마나 자연스럽게 어울리는지 평가해주세요.<br><br>개인적인 음악 취향보다 행사 분위기와 음악의 적합도를 기준으로 판단해주세요.</p>
      <label for="evaluator">평가자 선택</label>
      <select id="evaluator">
        <option value="">선택하세요</option>
        <option value="evaluator-01">평가자 1</option>
        <option value="evaluator-02">평가자 2</option>
        <option value="evaluator-03">평가자 3</option>
      </select>
      <p class="status" id="resume-status" aria-live="polite"></p>
      <button class="primary" id="start-button" disabled>평가 시작</button>
      <button class="secondary" id="reset-data-button" type="button">평가 데이터 초기화</button>
      <p class="status small" id="reset-status" aria-live="polite"></p>
      <p class="status small" id="load-status" aria-live="polite">평가 자료를 확인하는 중입니다.</p>
    </section>

    <section class="card" id="evaluation" aria-live="polite">
      <div class="topline">
        <h1>음악-행사 적합도 평가</h1>
        <span class="position" id="position">1 / 96</span>
      </div>
      <progress id="progress" max="96" value="0" aria-label="평가 진행률"></progress>
      <h2>행사 설명</h2>
      <div class="event" id="event-text"></div>
      <audio id="audio" controls preload="none"></audio>
      <div class="time"><span id="elapsed">00:00</span> / <span id="duration">00:56</span></div>
      <p class="question">이 행사에 이 음악이 얼마나 잘 어울린다고 생각하시나요?</p>
      <div class="rating-grid" id="rating-buttons"></div>
      <div class="scale" aria-hidden="true">
        <span>전혀 어울리지 않음</span><span>잘 어울리지 않음</span><span>보통</span><span>잘 어울림</span><span>매우 잘 어울림</span>
      </div>
      <button class="unable" id="unable-button" type="button">판단하기 어려움</button>
      <div class="nav">
        <button class="secondary" id="previous-button" type="button">이전</button>
        <button class="primary" id="next-button" type="button" disabled>다음</button>
      </div>
      <p class="status small" id="save-status" aria-live="polite"></p>
    </section>

    <section class="card" id="complete">
      <h1>평가가 완료되었습니다.</h1>
      <p class="muted">현재 평가자 응답은 이 브라우저에 저장되어 있습니다.</p>
      <button class="primary" id="export-button" type="button">결과 CSV 저장</button>
    </section>
  </main>

  <script>
    (() => {
      'use strict';
      const base = '/docs/experiments/audio-similarity-calibration';
      const assignmentUrl = `${base}/artifacts/listening-evaluation-assignments.csv`;
      const mappingUrl = `${base}/artifacts/listening-evaluation-mapping.json`;
      const queryUrl = `${base}/event-queries.json`;
      const evaluatorIds = ['evaluator-01', 'evaluator-02', 'evaluator-03'];
      const scaleLabels = {
        1: '전혀 어울리지 않음', 2: '잘 어울리지 않음', 3: '보통',
        4: '잘 어울림', 5: '매우 잘 어울림'
      };
      const el = (id) => document.getElementById(id);
      const state = { evaluators: null, evaluatorId: '', items: [], responses: new Map(), index: 0, storageOk: true };

      function parseCsv(source) {
        const text = source.replace(/^\uFEFF/, '');
        const rows = [];
        let row = [], field = '', quoted = false;
        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          if (quoted) {
            if (char === '"' && text[i + 1] === '"') { field += '"'; i += 1; }
            else if (char === '"') quoted = false;
            else field += char;
          } else if (char === '"') quoted = true;
          else if (char === ',') { row.push(field); field = ''; }
          else if (char === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
          else field += char;
        }
        if (field.length || row.length) { row.push(field.replace(/\r$/, '')); rows.push(row); }
        const headers = rows.shift();
        if (!headers || headers.length < 1) throw new Error('assignment CSV header missing');
        return rows.filter((r) => r.some((v) => v !== '')).map((values) => {
          if (values.length !== headers.length) throw new Error('malformed assignment CSV row');
          return Object.fromEntries(headers.map((header, index) => [header, values[index]]));
        });
      }

      function validateAndBuild(csvRows, mapping, queryData) {
        if (csvRows.length !== 288 || mapping.selection?.selected_pair_count !== 96 || mapping.pairs?.length !== 96) throw new Error('frozen evaluation row count mismatch');
        const pairByEvaluation = new Map();
        const pairIds = new Set();
        for (const pair of mapping.pairs) {
          if (!pair.pair_id || pairIds.has(pair.pair_id) || pair.evaluation_ids?.length !== 3 || pair.evaluator_ids?.length !== 3) throw new Error('ambiguous pair mapping');
          pairIds.add(pair.pair_id);
          for (const id of pair.evaluation_ids) {
            if (pairByEvaluation.has(id)) throw new Error('duplicate evaluation mapping');
            pairByEvaluation.set(id, pair);
          }
        }
        if (pairIds.size !== 96 || pairByEvaluation.size !== 288) throw new Error('mapping coverage mismatch');
        const canonicalText = new Map(queryData.queries.filter((q) => q.selection_status === 'active_v1').map((q) => [q.query_id, q.msclap_model_input?.text]));
        if (canonicalText.size !== 16 || [...canonicalText.values()].some((v) => typeof v !== 'string' || !v.trim())) throw new Error('canonical event query text missing');
        const byEvaluator = Object.fromEntries(evaluatorIds.map((id) => [id, []]));
        const evaluationIds = new Set();
        const assignedEvaluators = new Map([...pairIds].map((id) => [id, new Set()]));
        for (const row of csvRows) {
          if (!evaluatorIds.includes(row.evaluator_id) || evaluationIds.has(row.evaluation_id)) throw new Error('invalid evaluator assignment');
          evaluationIds.add(row.evaluation_id);
          const pair = pairByEvaluation.get(row.evaluation_id);
          if (!pair || pair.query_id !== row.query_id || pair.blind_audio_id !== row.sample_id || pair.playback_path !== row.playback_path) throw new Error('assignment to mapping mismatch');
          if (!pair.evaluator_ids.includes(row.evaluator_id) || assignedEvaluators.get(pair.pair_id).has(row.evaluator_id)) throw new Error('pair evaluator assignment mismatch');
          assignedEvaluators.get(pair.pair_id).add(row.evaluator_id);
          const text = canonicalText.get(row.query_id);
          if (!text || text !== row.event_query_text) throw new Error('event text differs from canonical query');
          byEvaluator[row.evaluator_id].push({
            evaluator_id: row.evaluator_id,
            evaluation_id: row.evaluation_id,
            presentation_order: Number(row.presentation_order),
            pair_id: pair.pair_id,
            query_id: row.query_id,
            query_text: text,
            playback_path: row.playback_path,
            blind_audio_id: row.sample_id
          });
        }
        if (evaluationIds.size !== 288) throw new Error('assignment rows are not unique');
        for (const pair of mapping.pairs) {
          const actual = assignedEvaluators.get(pair.pair_id);
          if (actual.size !== 3 || [...actual].sort().join('|') !== [...pair.evaluator_ids].sort().join('|')) throw new Error('pair evaluator coverage mismatch');
        }
        for (const evaluatorId of evaluatorIds) {
          const items = byEvaluator[evaluatorId];
          if (items.length !== 96 || new Set(items.map((x) => x.pair_id)).size !== 96 || new Set(items.map((x) => x.presentation_order)).size !== 96 || items.some((x) => !Number.isInteger(x.presentation_order) || x.presentation_order < 1 || x.presentation_order > 96)) throw new Error(`invalid assignments for ${evaluatorId}`);
          items.sort((a, b) => a.presentation_order - b.presentation_order);
        }
        const files = mapping.playback?.files;
        if (!Array.isArray(files) || files.length !== 40) throw new Error('frozen playback inventory mismatch');
        const playbackByBlindId = new Map(files.map((file) => [file.blind_audio_id, file]));
        if (playbackByBlindId.size !== 40) throw new Error('duplicate playback identity');
        const referenced = new Set(mapping.pairs.map((pair) => pair.blind_audio_id));
        if (referenced.size !== 40 || [...referenced].some((id) => !playbackByBlindId.has(id))) throw new Error('required playback mapping missing');
        for (const pair of mapping.pairs) {
          const playback = playbackByBlindId.get(pair.blind_audio_id);
          if (playback.path !== pair.playback_path || playback.sample_id !== pair.sample_id || playback.prepared_sha256 !== pair.prepared_sha256) throw new Error('playback identity mismatch');
        }
        return { byEvaluator, files: [...playbackByBlindId.values()] };
      }

      async function loadData() {
        const [csvResponse, mappingResponse, queryResponse] = await Promise.all([
          fetch(assignmentUrl), fetch(mappingUrl), fetch(queryUrl)
        ]);
        if (![csvResponse, mappingResponse, queryResponse].every((response) => response.ok)) throw new Error('평가 자료를 불러오지 못했습니다. 로컬 서버 주소와 파일 상태를 확인해주세요.');
        const csvText = await csvResponse.text();
        let mapping = await mappingResponse.json();
        const queryData = await queryResponse.json();
        const safe = validateAndBuild(parseCsv(csvText), mapping, queryData);
        const paths = new Set(safe.files.map((f) => `/${f.path.replace(/^\/+/, '')}`));
        const checks = await Promise.all([...paths].map(async (path) => {
          const response = await fetch(path, { method: 'HEAD', cache: 'no-store' });
          return response.ok;
        }));
        if (checks.length !== 40 || checks.some((ok) => !ok)) throw new Error('재생 파일 중 일부를 찾을 수 없습니다. 평가 자료 위치를 확인해주세요.');
        mapping = null;
        return safe.byEvaluator;
      }

      function storageKey(evaluatorId) { return `calibration-listening-${evaluatorId}`; }
      function resetEvaluationData() {
        const confirmed = window.confirm('이 브라우저에 저장된 평가자 1~3의 진행 기록을 모두 삭제합니다.\n이미 실제 평가를 진행했다면 결과가 사라집니다.\n초기화하시겠습니까?');
        if (!confirmed) return;
        for (const evaluatorId of evaluatorIds) localStorage.removeItem(storageKey(evaluatorId));
        el('resume-status').textContent = '';
        el('reset-status').textContent = '평가 데이터가 초기화되었습니다.';
      }
      function readProgress(evaluatorId) {
        const raw = localStorage.getItem(storageKey(evaluatorId));
        if (!raw) return { responses: new Map(), currentPairId: '' };
        const saved = JSON.parse(raw);
        if (saved.evaluator_id !== evaluatorId || !Array.isArray(saved.responses)) throw new Error('저장된 평가 기록을 읽을 수 없습니다.');
        const validPairs = new Set(state.evaluators[evaluatorId].map((item) => item.pair_id));
        const responses = new Map();
        for (const response of saved.responses) {
          if (response.evaluator_id !== evaluatorId || !validPairs.has(response.pair_id) || responses.has(response.pair_id)) throw new Error('저장된 평가 기록의 pair 연결이 올바르지 않습니다.');
          const valid = (response.rating === null && response.unable_to_judge === true) || (Number.isInteger(response.rating) && response.rating >= 1 && response.rating <= 5 && response.unable_to_judge === false);
          if (!valid) throw new Error('저장된 평가 값이 올바르지 않습니다.');
          responses.set(response.pair_id, { rating: response.rating, unable_to_judge: response.unable_to_judge });
        }
        return { responses, currentPairId: saved.current_pair_id || '' };
      }
      function saveProgress(currentPairId) {
        try {
          const responses = [...state.responses.entries()].map(([pair_id, result]) => ({ evaluator_id: state.evaluatorId, pair_id, rating: result.rating, unable_to_judge: result.unable_to_judge }));
          localStorage.setItem(storageKey(state.evaluatorId), JSON.stringify({ evaluator_id: state.evaluatorId, current_pair_id: currentPairId, responses }));
          state.storageOk = true;
          el('save-status').textContent = '이 브라우저에 자동 저장되었습니다.';
          return true;
        } catch (_) {
          state.storageOk = false;
          el('save-status').textContent = '자동 저장에 실패했습니다. 저장 공간을 확인한 뒤 다시 선택해주세요.';
          return false;
        }
      }
      function currentResponse() { return state.responses.get(state.items[state.index]?.pair_id); }
      function formatTime(value) {
        if (!Number.isFinite(value) || value < 0) return '00:00';
        const seconds = Math.floor(value);
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }
      function render() {
        const item = state.items[state.index];
        const response = currentResponse();
        const completeCount = state.responses.size;
        el('position').textContent = `${state.index + 1} / 96`;
        el('progress').value = completeCount;
        el('event-text').textContent = item.query_text;
        const audio = el('audio');
        audio.pause();
        audio.src = `/${item.playback_path.replace(/^\/+/, '')}`;
        audio.load();
        el('elapsed').textContent = '00:00';
        el('duration').textContent = '00:56';
        const buttonArea = el('rating-buttons');
        buttonArea.replaceChildren();
        for (let rating = 1; rating <= 5; rating += 1) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `rating${response?.rating === rating ? ' selected' : ''}`;
          button.textContent = String(rating);
          button.setAttribute('aria-label', `${rating}점 ${scaleLabels[rating]}`);
          button.setAttribute('aria-pressed', String(response?.rating === rating));
          button.addEventListener('click', () => {
            state.responses.set(item.pair_id, { rating, unable_to_judge: false });
            const saved = saveProgress(item.pair_id);
            render();
            if (!saved) el('save-status').textContent = '자동 저장에 실패했습니다. 저장 공간을 확인한 뒤 다시 선택해주세요.';
          });
          buttonArea.append(button);
        }
        const unable = el('unable-button');
        unable.classList.toggle('selected', response?.unable_to_judge === true);
        unable.setAttribute('aria-pressed', String(response?.unable_to_judge === true));
        el('previous-button').disabled = state.index === 0;
        el('next-button').disabled = !response || !state.storageOk;
        el('next-button').textContent = state.index === 95 ? '평가 완료' : '다음';
      }
      function showComplete() {
        if (state.responses.size !== 96 || state.items.some((item) => !state.responses.has(item.pair_id))) return false;
        el('evaluation').style.display = 'none';
        el('complete').style.display = 'block';
        return true;
      }
      function begin(evaluatorId) {
        state.evaluatorId = evaluatorId;
        state.items = state.evaluators[evaluatorId];
        const progress = readProgress(evaluatorId);
        state.responses = progress.responses;
        state.storageOk = true;
        el('start').style.display = 'none';
        if (state.responses.size === 96) { showComplete(); return; }
        state.index = state.items.findIndex((item) => !state.responses.has(item.pair_id));
        if (state.index < 0) state.index = 0;
        el('evaluation').style.display = 'block';
        saveProgress(state.items[state.index].pair_id);
        render();
      }
      function exportCsv() {
        if (state.responses.size !== 96 || state.items.some((item) => !state.responses.has(item.pair_id))) return;
        const quote = (value) => `"${String(value).replace(/"/g, '""')}"`;
        const lines = [['evaluator_id','pair_id','rating','unable_to_judge'].map(quote).join(',')];
        for (const item of state.items) {
          const response = state.responses.get(item.pair_id);
          lines.push([state.evaluatorId,item.pair_id,response.unable_to_judge ? '' : response.rating,response.unable_to_judge].map(quote).join(','));
        }
        const blob = new Blob(['\uFEFF', lines.join('\r\n'), '\r\n'], { type: 'text/csv;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `listening-${state.evaluatorId}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      el('evaluator').addEventListener('change', () => {
        const evaluatorId = el('evaluator').value;
        el('resume-status').textContent = '';
        if (!evaluatorId || !state.evaluators) return;
        try {
          const saved = readProgress(evaluatorId);
          el('resume-status').textContent = saved.responses.size ? `기존 평가 진행 기록이 있습니다. 완료 ${saved.responses.size} / 96` : '';
        } catch (error) { el('resume-status').textContent = error.message; }
      });
      el('start-button').addEventListener('click', () => {
        const evaluatorId = el('evaluator').value;
        if (!evaluatorId || !state.evaluators) return;
        try { begin(evaluatorId); }
        catch (error) { el('load-status').textContent = error.message; el('load-status').className = 'status error'; }
      });
      el('reset-data-button').addEventListener('click', resetEvaluationData);
      el('previous-button').addEventListener('click', () => {
        if (state.index === 0) return;
        state.index -= 1;
        saveProgress(state.items[state.index].pair_id);
        render();
      });
      el('next-button').addEventListener('click', () => {
        if (!currentResponse() || !state.storageOk) return;
        if (state.index === 95) {
          if (showComplete()) return;
          return;
        }
        state.index += 1;
        saveProgress(state.items[state.index].pair_id);
        render();
      });
      el('unable-button').addEventListener('click', () => {
        const item = state.items[state.index];
        const wasSelected = currentResponse()?.unable_to_judge === true;
        if (wasSelected) state.responses.delete(item.pair_id);
        else state.responses.set(item.pair_id, { rating: null, unable_to_judge: true });
        const saved = saveProgress(item.pair_id);
        render();
        if (!saved) el('save-status').textContent = '자동 저장에 실패했습니다. 저장 공간을 확인한 뒤 다시 선택해주세요.';
      });
      el('audio').addEventListener('timeupdate', () => { el('elapsed').textContent = formatTime(el('audio').currentTime); });
      el('audio').addEventListener('loadedmetadata', () => { el('duration').textContent = formatTime(el('audio').duration); });
      el('audio').addEventListener('error', () => { el('save-status').textContent = '재생 파일을 불러오지 못했습니다.'; });
      el('export-button').addEventListener('click', exportCsv);

      loadData().then((evaluators) => {
        state.evaluators = evaluators;
        el('start-button').disabled = false;
        el('load-status').textContent = '평가 자료 확인 완료';
      }).catch((error) => {
        el('load-status').textContent = error.message || '평가 자료를 확인하지 못했습니다.';
        el('load-status').className = 'status error';
      });
    })();
  </script>
</body>
</html>

name: AI Docker Publish # main 반영 후에만 GHCR 게시를 수행합니다.

on:
  push:
    branches: [main] # feature 브랜치 push에서는 실행하지 않습니다.

permissions:
  contents: read # 기본값은 읽기이며, 게시 job에만 packages 쓰기를 추가합니다.

concurrency:
  group: ai-docker-publish-main # main 게시 작업을 동시에 실행하지 않습니다.
  cancel-in-progress: false # 진행 중인 게시를 중간에 취소하지 않습니다.

jobs:
  test:
    uses: ./.github/workflows/ci.yml # 직접 main push가 발생해도 테스트를 통과해야 게시합니다.
    permissions:
      contents: read # 테스트에 GHCR 쓰기 권한을 주지 않습니다.

  publish:
    name: Build and push to GHCR
    needs: test # 테스트 실패 시 게시를 막습니다.
    runs-on: ubuntu-latest # Linux amd64 이미지를 생성합니다.
    timeout-minutes: 30 # 빌드 시간의 상한을 둡니다.
    permissions:
      contents: read # 소스를 읽습니다.
      packages: write # 이 job의 GITHUB_TOKEN으로 GHCR에 이미지를 게시합니다.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # Git 쓰기 인증을 유지하지 않습니다.

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Dockerfile is required at the repository root. Define the AI container runtime before publishing."
            exit 1
          fi

      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }} # 소유자 값을 shell 코드와 분리합니다.
        run: echo "name=ghcr.io/${OWNER,,}/ai-server" >> "$GITHUB_OUTPUT" # GHCR 경로를 소문자로 만듭니다.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }} # ghcr.io/nsucapstoneteam/ai-server
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io # GitHub Container Registry를 사용합니다.
          username: ${{ github.actor }} # 실행 사용자의 GitHub 이름입니다.
          password: ${{ secrets.GITHUB_TOKEN }} # 별도의 PAT Secret을 만들 필요가 없습니다.

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: . # 저장소 루트를 빌드 컨텍스트로 사용합니다.
          file: ./Dockerfile # 후속 Docker 구성에서 이 경로를 사용해야 합니다.
          platforms: linux/amd64 # MVP에서는 한 플랫폼만 빌드합니다.
          push: true # 성공한 이미지를 GHCR에 게시합니다.
          tags: ${{ steps.meta.outputs.tags }} # latest와 전체 커밋 SHA 태그를 함께 게시합니다.
          labels: ${{ steps.meta.outputs.labels }} # Repository 연결용 OCI label을 포함합니다.
          cache-from: type=gha # 이전 빌드의 레이어를 재사용합니다.
          cache-to: type=gha,mode=max # 다음 main 빌드를 위해 캐시를 저장합니다.

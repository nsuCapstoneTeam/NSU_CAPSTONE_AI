name: Docker Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/docker-publish.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag nsu-capstone-ai:ci .

      - name: Run API and core tests
        run: |
          docker run --rm \
            --mount type=bind,source="${{ github.workspace }}/tests",target=/workspace/tests,readonly \
            nsu-capstone-ai:ci python -m pytest tests/api tests/core -q

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nsucapstoneteam/nsu-capstone-ai:latest
            ghcr.io/nsucapstoneteam/nsu-capstone-ai:phase1
